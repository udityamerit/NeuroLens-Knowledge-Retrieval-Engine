# docker compose up --build        -> SQLite (single container, data in the "neurolens-data" volume)
# docker compose --profile postgres up --build   -> also starts Postgres; set DATABASE_URL accordingly (see .env.example)
services:
  api:
    build: ./backend
    env_file: .env
    environment:
      NEUROLENS_ENV: production
      TRUST_PROXY_HEADERS: "true"
    volumes:
      - neurolens-data:/data
    restart: unless-stopped
    expose: ["8000"]

  web:
    build: ./frontend
    depends_on: [api]
    ports: ["8080:8080"]
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    profiles: [postgres]
    environment:
      POSTGRES_USER: neurolens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: neurolens
    volumes:
      - neurolens-pg:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  neurolens-data:
  neurolens-pg:
