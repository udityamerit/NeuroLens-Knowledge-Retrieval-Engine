name: NeuroLens CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-dev.txt
        working-directory: backend
      - name: Run tests (no secrets, no network, hash embedder)
        run: python -m pytest -q
        working-directory: backend
      - name: Dependency vulnerability scan
        run: pip install pip-audit && pip-audit -r requirements.txt
        working-directory: backend
        continue-on-error: true

  frontend:
    name: Frontend lint, build, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Fail if a credential-looking string ended up in the bundle
        run: "! grep -rEl 'gsk_[A-Za-z0-9]{20}|sk-or-v1-|sk-[A-Za-z0-9]{32}' frontend/dist"
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build ./backend -t neurolens-api:ci
      - run: docker build ./frontend -t neurolens-web:ci
