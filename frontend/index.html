<!doctype html>
<html lang="en">
  <head>
    <!-- Early JavaScript crash catcher for WebView debugging -->
    <script>
      (function() {
        window.onerror = function(message, source, lineno, colno, error) {
          var errStr = message + '\nAt: ' + source + ':' + lineno + ':' + colno;
          if (window.AndroidBridge) {
            window.AndroidBridge.reportError(errStr);
          }
          return false;
        };
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var errStr = 'Unhandled Rejection: ' + (reason && reason.stack ? reason.stack : reason);
          if (window.AndroidBridge) {
            window.AndroidBridge.reportError(errStr);
          }
        });
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NeuroLens - Smart RAG Document Analyst</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- PDF.js and Mammoth for client-side document parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
